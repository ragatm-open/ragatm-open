# Analyses globales de corpus (L2 + L4).
#
# Principe transverse : une analyse déclare TOUJOURS son périmètre. Le scan, les
# candidats et les éléments traités sont trois compteurs DISTINCTS — les
# confondre reviendrait à présenter un échantillon comme un parcours du corpus.

AnalysisStatus:
  type: string
  description: >
    Cycle de vie d'un job. `partial` signale un résultat AMPUTÉ (au moins un lot
    n'a pas abouti) : il n'est jamais présenté comme complet.
  enum: [pending, running, succeeded, partial, failed, cancelled]

AnalysisErrorCode:
  type: string
  description: Code d'erreur stable. Le message associé est toujours sûr (jamais une trace).
  enum:
    - unknown_analysis_type
    - preflight_limit_exceeded
    - analytics_concurrency_limit
    - global_search_topic_required
    - candidate_limit_exceeded
    - invalid_unsourced_result
    - gateway_unavailable
    - cancelled
    - soft_time_limit
    - handler_error
    - invalid_result
    - permission_revoked
    - internal_error

AnalysisProgress:
  type: object
  required: [phase, current, total, percent]
  properties:
    phase:
      type: string
      description: Phase stable et non sensible (aucun nom de table, de SQL ni de technologie).
      example: processing_batches
    current: { type: integer, minimum: 0 }
    total: { type: integer, minimum: 0 }
    percent:
      type: integer
      minimum: 0
      maximum: 100
      description: Calculé côté serveur. Monotone — ne décroît jamais.

AnalysisPreflight:
  type: object
  description: Volumétrie du périmètre, établie AVANT toute dépense.
  properties:
    documents_total: { type: integer }
    documents_ready: { type: integer }
    documents_failed: { type: integer }
    documents_without_chunks: { type: integer }
    chunks_total: { type: integer }
    pages_numbered_total: { type: integer }
    characters_total: { type: integer }
    estimated_tokens_total: { type: integer }
    corpus_fingerprint: { type: string }
    within_limits: { type: boolean }
    limits_exceeded:
      type: array
      items:
        type: object
        properties:
          limit: { type: string }
          value: { type: integer }
          max: { type: integer }

GlobalSearchSource:
  type: object
  required: [chunk_id, document_id]
  properties:
    chunk_id: { type: string, format: uuid }
    document_id: { type: string, format: uuid }
    page: { type: integer, nullable: true }
    filename:
      type: string
      nullable: true
      description: >
        Nom du document cité, FIGÉ au moment de l'analyse — le résultat est
        persisté et doit rester lisible même si le document est supprimé ensuite.
        `null` si le document était déjà introuvable. Absent des résultats produits
        avant l'introduction du champ : le client doit tolérer son absence.

GlobalSearchItem:
  type: object
  description: >
    Élément produit par la recherche globale. Il porte TOUJOURS au moins une
    source réelle : un identifiant inventé par le modèle est rejeté avant
    persistance, et un élément sans source n'est jamais publié.
  required: [id, statement, sources]
  properties:
    id: { type: string }
    statement: { type: string }
    sources:
      type: array
      minItems: 1
      items: { $ref: "#/GlobalSearchSource" }
    confidence: { type: number, nullable: true, minimum: 0, maximum: 1 }

GlobalSearchMetrics:
  type: object
  description: >
    Trois compteurs DISTINCTS, jamais interchangeables :
    `chunks_scanned` = tout le contenu textuel exploitable interrogé par le
    préfiltre ; `candidate_chunks` = ce que le préfiltre a retenu ;
    `processed_chunks` = ce qui a réellement été traité.
  properties:
    chunks_scanned: { type: integer }
    documents_text_scanned: { type: integer }
    candidate_chunks: { type: integer }
    candidate_documents: { type: integer }
    processed_chunks: { type: integer }
    processed_documents: { type: integer }
    batches_total: { type: integer }
    batches_failed: { type: integer }
    fts_configuration: { type: string }

GlobalSearchResult:
  type: object
  properties:
    result_version: { type: string, example: "1" }
    query: { type: string }
    summary_markdown:
      type: string
      description: >
        Synthèse sourcée. Déclare que tout le contenu textuel exploitable a été
        interrogé par le préfiltre LEXICAL, et rappelle explicitement que celui-ci
        peut ne pas reconnaître toutes les formulations équivalentes. Ne promet
        JAMAIS une exhaustivité sémantique.
    items:
      type: array
      items: { $ref: "#/GlobalSearchItem" }
    search: { $ref: "#/GlobalSearchMetrics" }

CorpusAnalysis:
  type: object
  required: [analysis_id, rag_space_id, analysis_type, status, progress]
  properties:
    analysis_id: { type: string, format: uuid }
    rag_space_id: { type: string, format: uuid }
    analysis_type:
      type: string
      description: Clé d'un registre FERMÉ côté serveur. Jamais un chemin d'import.
      enum: [corpus.coverage_snapshot, corpus.global_search]
    parameters: { type: object, additionalProperties: true }
    status: { $ref: "#/AnalysisStatus" }
    progress: { $ref: "#/AnalysisProgress" }
    preflight: { $ref: "#/AnalysisPreflight" }
    coverage:
      nullable: true
      allOf: [{ $ref: "#/Coverage" }]
    result:
      type: object
      nullable: true
      additionalProperties: true
      description: Dépend du type. Pour `corpus.global_search` → `GlobalSearchResult`.
    error_code:
      nullable: true
      allOf: [{ $ref: "#/AnalysisErrorCode" }]
    error_message:
      type: string
      nullable: true
      description: Message SÛR pour l'utilisateur. Jamais une exception ni une trace.
    corpus_fingerprint: { type: string }
    is_stale:
      type: boolean
      nullable: true
      description: >
        Le corpus a-t-il changé depuis la génération du résultat ? `null` tant que
        le job n'est pas terminal (aucun recalcul d'empreinte pendant le polling).
        Un résultat périmé n'est jamais modifié ni supprimé — il est signalé.
    created_at: { type: string, format: date-time, nullable: true }
    started_at: { type: string, format: date-time, nullable: true }
    finished_at: { type: string, format: date-time, nullable: true }
    expires_at: { type: string, format: date-time, nullable: true }
    tokens_in: { type: integer }
    tokens_out: { type: integer }
    cost_usd: { type: number, nullable: true }
    reused:
      type: boolean
      description: Un résultat déjà calculé sur un corpus inchangé a été réutilisé.
    joined_active:
      type: boolean
      description: Une analyse identique était déjà en cours ; celle-ci l'a rejointe.

Coverage:
  type: object
  description: >
    Périmètre RÉELLEMENT couvert. `coverage_complete` ne peut jamais être vrai
    s'il reste une exclusion ou une limite appliquée. Voir docs/coverage-semantics.md.
  properties:
    documents_total: { type: integer }
    documents_considered: { type: integer }
    documents_analyzed: { type: integer }
    documents_with_results: { type: integer }
    documents_excluded:
      type: array
      items:
        type: object
        properties:
          reason: { type: string }
          count: { type: integer }
          label: { type: string }
    pages_analyzed: { type: integer }
    chunks_analyzed: { type: integer }
    items_extracted: { type: integer }
    items_without_source:
      type: integer
      description: Vaut TOUJOURS 0 dans un résultat accepté. Sinon le résultat est rejeté.
    coverage_level:
      type: string
      description: >
        A = documentaire, B = textuelle (toutes deux GARANTIES et mesurables).
        C (sémantique) et D (métier) ne sont jamais produits : ils ne sont pas
        garantissables techniquement.
      enum: [A, B, C, D]
    coverage_complete: { type: boolean }
    coverage_ratio: { type: number, minimum: 0, maximum: 1 }
    limits_applied:
      type: array
      items: { type: string }

AnalysisCreateRequest:
  type: object
  required: [analysis_type]
  properties:
    analysis_type:
      type: string
      enum: [corpus.coverage_snapshot, corpus.global_search]
    parameters:
      type: object
      description: >
        Pour `corpus.global_search` : `{query, language}` UNIQUEMENT. Le client ne
        peut fixer ni top_k, ni batch_size, ni provider, ni modèle, ni température,
        ni fallback, ni configuration FTS — ce sont des décisions serveur.
      properties:
        query: { type: string, maxLength: 500 }
        language: { type: string, example: auto }
    request_id:
      type: string
      maxLength: 200
      description: Idempotence — le même request_id ne crée jamais un second job.
